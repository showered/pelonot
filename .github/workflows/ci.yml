# PLAN 19.1.4. What a maintainer would otherwise run by hand: the build a fresh
# clone gets, and the JVM tests. Deliberately *not* `connectedDebugAndroidTest`
# — it needs an emulator, and this project's instrumented suite is
# order-dependent (see CLAUDE.md), so red runs there would train everyone to
# ignore it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same PR cancels the first: the answer that matters is
# the one about the head commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No `local.properties` here, and that is the point: the cloud
      # credentials are optional by design (14.10.3), so a clone with none of
      # them must still build and run offline. If this step ever needs a secret,
      # something has stopped being offline-first.
      - name: Build
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7
