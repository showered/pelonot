# PLAN 19.1.4. What a maintainer would otherwise run by hand: the build a fresh
# clone gets, and the JVM tests. Deliberately *not* `connectedDebugAndroidTest`
# — and the reason has changed, so it is written out rather than left pointing at
# a claim that is no longer true. The old reason was that the instrumented suite
# is order-dependent; 8.15.1 measured that and it is fixed. The reason now is
# `WorkoutServiceTest`'s fixed 15-second waits, which were calibrated against a
# local hardware-accelerated AVD: a cloud emulator boots cold and usually without
# KVM, so those waits are exactly where a green suite would start going red —
# which would *manufacture* the flakiness this refusal was always about rather
# than inherit it. 8.15.2 has the conditions for changing this, in order.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same PR cancels the first: the answer that matters is
# the one about the head commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No `local.properties` here, and that is the point: the cloud
      # credentials are optional by design (14.10.3), so a clone with none of
      # them must still build and run offline. If this step ever needs a secret,
      # something has stopped being offline-first.
      - name: Build
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # 19.1.7a. STATUS.md is regenerated rather than maintained, and it had
      # gone stale once with two disagreeing box counts on the same page. The
      # script emits the measurements only — no script can check the prose —
      # and it reads the test count out of the results the step above just
      # wrote, so it has to run after it and only when it passed.
      - name: STATUS.md figures
        run: ./tools/status-figures.sh --check

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7
