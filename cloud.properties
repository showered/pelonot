# Where the cloud lives — checked in on purpose (PLAN 14.10.1).
#
# `local.properties` is git-ignored, so before this file existed a fresh clone
# of an open-source project had no cloud, no way to find out what the endpoint
# even was, and nothing in the repo saying so. This file is that record.
#
# Precedence, highest first (14.10.2):
#
#   1. environment       SUPABASE_URL, SUPABASE_ANON_KEY
#   2. local.properties  supabase.url, supabase.anonKey   (git-ignored)
#   3. this file
#   4. nothing           -> the app is offline, which is a supported state
#
# Both values are deliberately EMPTY, and that is the current answer rather
# than an oversight (14.10.4). Two reasons, and the second is the less obvious:
#
#   * A publishable key is safe to check in exactly when row-level security is
#     correct. Every policy on the project is `USING (true)` today (15.5), so
#     publishing a key here would publish everyone's data with it.
#
#   * A published endpoint is a bill. At the measured ~30 KB a stored ride,
#     Supabase's 500 MB free tier is about 13,000 rides — 250 riders riding
#     once a week for a year. A community endpoint fills up in its first year
#     and then fails for everyone at once, including the riders who trusted it
#     with their only backup.
#
# So the default is no endpoint, and a self-hoster stands up their own:
# `supabase/README.md` has the migrations and the order to run them in.
#
# `CloudConfigFenceTest` fails the build if either value stops being empty, so
# that this decision gets re-taken deliberately rather than by a commit.

supabase.url=
supabase.anonKey=
