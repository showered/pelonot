# What version this is (PLAN 30.2.1).
#
# Two numbers, and they are for different readers. `versionCode` is a monotonic
# integer nothing but the machine ever sees — it is what an update check
# compares, and 30.2.3 refuses anything that is not strictly greater than the
# installed one, because an OTA channel able to offer an older APK would wipe a
# rider's database through a dialog they said yes to (12.5.1). `versionName` is
# what a person reads, in Settings and in a release's notes.
#
# **Raised by `tools/release.sh`, not by hand**, so that a release cannot ship
# advertising a version somebody forgot to bump. It lives in a checked-in file
# rather than being derived from `git rev-list --count` so that a fresh clone,
# or a tarball with no history in it, can still say what it is.
versionCode=3
versionName=1.0.2
