<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link a Pelonot bike</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main>
  <!-- One heading, and the sentence that used to sit under it has moved to the
       card that needs it (PLAN 17.16.9). A heading, a subtitle and a status
       line all narrating the same thing is three voices for one page. -->
  <header>
    <h1>Link a bike</h1>
  </header>

  <p id="status" class="small"></p>
  <p id="signed-in-as" class="small muted hidden"></p>

  <!-- The device being paired, named before anything is committed to.
       A pairing page that does not say what it is pairing is a phishing
       primitive: the QR is a URL and anyone can print a URL. PLAN 15.6.5.
       Note where that protection actually lives: on the confirm step below,
       which is the only place a session leaves this phone. Signing in is not
       gated on it — see 17.16.6. -->
  <div class="card hidden" id="device-card">
    <p class="figure-label" id="device-caption">This will sign in</p>
    <p class="figure" id="device-label">…</p>
    <p class="small muted" id="device-code"></p>
  </div>

  <!-- No code in the URL, or one the server did not recognise. -->
  <section id="need-code" class="hidden">
    <div class="card">
      <label for="code">Code from the bike's screen</label>
      <input id="code" inputmode="text" autocapitalize="characters" class="device"
             placeholder="ABCD 2345">
      <button id="code-go" type="button">Continue</button>
    </div>
  </section>

  <section id="signed-out" class="hidden">
    <div class="card">
      <!-- The one sentence about what happens next, where the rider is about
           to act rather than at the top of the page (17.16.9). -->
      <p class="small muted">Sign in here and the bike signs itself in.</p>
      <div class="tabs">
        <button id="tab-signin" aria-pressed="true">Sign in</button>
        <button id="tab-signup" aria-pressed="false">Create an account</button>
      </div>
      <form id="auth-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <p id="auth-error" class="small error"></p>
        <button id="auth-submit" type="submit">Sign in</button>
      </form>
    </div>
  </section>

  <section id="confirm" class="hidden">
    <div class="card">
      <!-- Shown only when the hand-off falls back to giving the bike this
           phone's own session (15.6.9) — which the live project does not do:
           probed 5 August, /functions/v1/link-device answers 401, not 404, so
           the bike is minted a session of its own and this phone keeps hers.
           The sentence that used to follow ("that is a limitation of this
           setup, not of the bike") is gone: it is a maintainer explaining
           himself inside a rider's sentence (17.16.9). -->
      <p id="fallback-warning" class="small hidden">
        <strong>You'll be signed out on this phone</strong> — it is handing the
        bike its own session. Sign back in here whenever you like.
      </p>
      <button id="confirm-go" type="button">Sign this bike in</button>
      <button id="not-me" class="secondary" type="button">Not now</button>
    </div>
  </section>

  <section id="done" class="hidden">
    <div class="card">
      <p class="figure">Done</p>
      <p class="small muted" id="done-text">
        The bike should be signed in within a couple of seconds. You can close
        this page.
      </p>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js" onerror="void 0"></script>
<script src="lib.js"></script>
<script src="link.js"></script>
</body>
</html>
